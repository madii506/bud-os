<div id="boot" hidden>
  <div class="bl" aria-hidden="true"><i></i></div>

      <button type="button" id="sndb" title="sound">♪</button>
      <span id="clock">--:--</span>
    </div>
  </nav>

</div>

<div id="crt" aria-hidden="true"></div>
